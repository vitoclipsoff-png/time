<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitan.ai - منظم الجداول الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.svg" alt="Vitan.ai Logo">
        </div>
        <nav>
            <!-- Navigation items can go here -->
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>صف الجدول الذي تريده</h2>
            <p>اكتب وصفًا للجدول الذي تريد إنشاءه، وسيقوم الذكاء الاصطناعي بتنظيمه لك.</p>
            <textarea id="table-description" rows="4" placeholder="مثال: جدول لتنظيم مهامي اليومية مع أعمدة للمهمة، الوقت، والحالة"></textarea>
            <button id="generate-table-btn">إنشاء الجدول</button>
            <div id="table-container">
                <!-- AI-generated table will be displayed here -->
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Vitan.ai</p>
    </footer>
</body>
</html>
